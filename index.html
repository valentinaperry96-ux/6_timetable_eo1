<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Build Your Schedule — Language Leader School</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    margin: 0;
    overflow: hidden; /* Prevent scrolling */
  }

  body {
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
    background:
      radial-gradient(circle at 12% 15%, rgba(255,255,255,.9) 0 3px, transparent 4px),
      radial-gradient(circle at 88% 76%, rgba(255,255,255,.85) 0 4px, transparent 5px),
      linear-gradient(135deg, #b9f6ff 0%, #62dcff 43%, #ff9f43 70%, #fff0a8 100%);
    color: #17234b;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .page {
    position: relative;
    width: 100%;
    height: 100%;
    max-height: 100dvh;
    overflow: hidden;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Y2K decorative blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(.2px);
    z-index: -2;
    pointer-events: none;
  }
  .blob.one {
    width: 30vw; height: 30vw;
    max-width: 390px; max-height: 390px;
    left: -8vw; top: -8vw;
    background: linear-gradient(145deg, #ff9f43, #ffb86c);
    box-shadow: inset -18px -18px 35px rgba(255,255,255,.35);
  }
  .blob.two {
    width: 27vw; height: 27vw;
    max-width: 340px; max-height: 340px;
    right: -7vw; bottom: -8vw;
    background: linear-gradient(145deg, #4facfe, #62dcff);
    box-shadow: inset 18px 18px 30px rgba(255,255,255,.35);
  }

  .sparkles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: -1;
  }
  .sparkles span {
    position: absolute;
    color: white;
    text-shadow: 0 2px 8px rgba(89,65,180,.35);
    font-weight: 900;
  }
  .s1 { left: 7%; top: 28%; font-size: 30px; transform: rotate(12deg); }
  .s2 { right: 7%; top: 17%; font-size: 22px; }
  .s3 { left: 48%; top: 7%; font-size: 18px; }
  .s4 { right: 35%; bottom: 8%; font-size: 28px; transform: rotate(-15deg); }
  .s5 { left: 5%; bottom: 13%; font-size: 17px; }

  .content {
    width: min(1100px, 94vw);
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: clamp(16px, 3vw, 32px);
    align-items: start;
    max-height: 100%;
    overflow: hidden;
  }

  .sticker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border: 3px solid #17234b;
    border-radius: 999px;
    background: #fff;
    color: #ff9f43;
    font-size: clamp(11px, 1.2vw, 14px);
    font-weight: 900;
    letter-spacing: .08em;
    box-shadow: 4px 4px 0 #17234b;
    transform: rotate(-2deg);
    margin-bottom: 12px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 4.5vw, 48px);
    line-height: .95;
    letter-spacing: -.04em;
    font-weight: 1000;
    text-transform: uppercase;
    color: #fff;
    -webkit-text-stroke: 2px #17234b;
    text-shadow:
      4px 4px 0 #ff9f43,
      8px 8px 0 rgba(23,35,75,.92);
  }

  .subtitle {
    font-size: clamp(13px, 1.4vw, 16px);
    font-weight: 800;
    color: #17234b;
    margin-bottom: 16px;
    line-height: 1.3;
  }

  /* Panels */
  .panel {
    background: #fff;
    border: 3px solid #17234b;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 8px 8px 0 #17234b;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .panel h2 {
    margin: 0 0 12px;
    font-size: 16px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: #17234b;
    border-bottom: 3px solid #17234b;
    padding-bottom: 8px;
    flex-shrink: 0;
  }

  /* Subjects */
  .subjects-container {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
  }
  .subjects-container::-webkit-scrollbar { width: 6px; }
  .subjects-container::-webkit-scrollbar-thumb { background: #ff9f43; border-radius: 3px; }

  .subject {
    padding: 10px 12px;
    margin-bottom: 10px;
    border-radius: 12px;
    color: #17234b;
    font-weight: 900;
    cursor: grab;
    user-select: none;
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 2px solid #17234b;
    box-shadow: 4px 4px 0 #17234b;
    font-size: 14px;
  }
  .subject:active { cursor: grabbing; }
  .subject:hover { 
    transform: translate(-2px, -2px); 
    box-shadow: 6px 6px 0 #17234b; 
  }
  .subject.dragging { opacity: 0.4; transform: rotate(3deg); }
  .subject .icon { font-size: 18px; }

  /* Subject specific gradients */
  .sub-english { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
  .sub-maths   { background: linear-gradient(135deg, #4facfe, #00f2fe); }
  .sub-art     { background: linear-gradient(135deg, #fa709a, #fee140); }
  .sub-sports  { background: linear-gradient(135deg, #43e97b, #38f9d7); }
  .sub-russian { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }

  /* Slots */
  .slots-container {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
    display: flex;
    flex-direction: column;
  }
  .slots-container::-webkit-scrollbar { width: 6px; }
  .slots-container::-webkit-scrollbar-thumb { background: #ff9f43; border-radius: 3px; }

  .slot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    margin-bottom: 10px;
    background: #f0f4ff;
    border: 3px dashed #17234b;
    border-radius: 14px;
    min-height: 56px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .slot.over {
    background: #fff86a;
    border-style: solid;
    transform: scale(1.02);
  }
  .slot.filled {
    border-style: solid;
    background: #fff;
  }

  .slot-time {
    font-size: 12px;
    font-weight: 900;
    color: #17234b;
    min-width: 68px;
    text-align: center;
    background: #fff86a;
    padding: 5px 4px;
    border-radius: 8px;
    border: 2px solid #17234b;
    box-shadow: 2px 2px 0 #17234b;
  }

  .slot-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ff9f43;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 13px;
    border: 2px solid #17234b;
    flex-shrink: 0;
  }

  .slot-content {
    flex: 1;
    font-weight: 800;
    color: #17234b;
  }
  .slot.empty .slot-content { 
    color: #8892b0; 
    font-style: italic; 
    font-weight: 700; 
    font-size: 13px;
  }

  .slot .subject {
    margin: 0;
    flex: 1;
    padding: 6px 10px;
    font-size: 13px;
    box-shadow: 3px 3px 0 #17234b;
  }

  .remove-btn {
    background: #ff9f43;
    color: #fff;
    border: 2px solid #17234b;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-weight: 900;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
    box-shadow: 2px 2px 0 #17234b;
    flex-shrink: 0;
  }
  .remove-btn:hover { transform: scale(1.15); }

  /* Controls */
  .controls {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  button.action {
    padding: 10px 20px;
    border: 3px solid #17234b;
    border-radius: 999px;
    font-weight: 900;
    cursor: pointer;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: .05em;
    transition: all 0.15s;
    color: #fff;
  }

  .btn-check { 
    background: #8dff72; 
    color: #17234b;
    box-shadow: 4px 4px 0 #17234b; 
  }
  .btn-reset { 
    background: #ff9f43; 
    box-shadow: 4px 4px 0 #17234b; 
  }

  button.action:hover:not(:disabled) { 
    transform: translate(-2px, -2px); 
    box-shadow: 6px 6px 0 #17234b; 
  }
  button.action:active:not(:disabled) {
    transform: translate(3px, 3px);
    box-shadow: 2px 2px 0 #17234b;
  }

  /* Messages */
  .message {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 12px;
    text-align: center;
    font-weight: 800;
    font-size: 14px;
    border: 3px solid #17234b;
    box-shadow: 4px 4px 0 rgba(23,35,75,.88);
    transform: rotate(-1deg);
    min-height: 24px;
    flex-shrink: 0;
  }
  .message.success { background: #d4edda; color: #155724; transform: rotate(1deg); }
  .message.error { background: #ffd1ed; color: #721c24; transform: rotate(-1deg); }
  .message.info { background: #fff86a; color: #17234b; transform: rotate(-1deg); }

  /* Responsive */
  @media (max-width: 800px) {
    body { overflow-y: auto; height: auto; min-height: 100dvh; justify-content: flex-start; padding: 12px; }
    .page { height: auto; max-height: none; overflow: visible; }
    .content {
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .panel {
      box-shadow: 6px 6px 0 #17234b;
    }
    h1 { text-align: center; font-size: 32px; }
    .sticker { margin: 0 auto 12px; }
    .subtitle { text-align: center; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="blob one"></div>
  <div class="blob two"></div>

  <div class="sparkles" aria-hidden="true">
    <span class="s1">✦</span>
    <span class="s2">✧</span>
    <span class="s3">★</span>
    <span class="s4">✦</span>
    <span class="s5">✧</span>
  </div>

  <div class="content">
    <!-- Left Panel: Subjects -->
    <div>
      <div class="sticker">✦ DRAG & DROP ✦</div>
      <h1>BUILD YOUR<br>SCHEDULE</h1>
      <p class="subtitle">Place 5 subjects into 7 lesson slots. 2 slots will stay empty!</p>
      
      <div class="panel">
        <h2>📚 Subjects</h2>
        <div class="subjects-container" id="subjectsList"></div>
      </div>
    </div>

    <!-- Right Panel: Schedule -->
    <div class="panel">
      <h2>📅 Today's Schedule</h2>
      <div class="slots-container" id="slotsList"></div>

      <div class="controls">
        <button class="action btn-check" onclick="checkSchedule()">✓ Check</button>
        <button class="action btn-reset" onclick="resetGame()">↺ Reset</button>
      </div>

      <div class="message info" id="message">Drag subjects from the left panel into the schedule slots</div>
    </div>
  </div>
</div>

<script>
  const SUBJECTS = [
    { id: 'english',  name: 'English',  icon: '🇬🇧', cls: 'sub-english' },
    { id: 'maths',    name: 'Maths',    icon: '🔢', cls: 'sub-maths' },
    { id: 'art',      name: 'Art',      icon: '🎨', cls: 'sub-art' },
    { id: 'sports',   name: 'Sports',   icon: '⚽', cls: 'sub-sports' },
    { id: 'russian',  name: 'Russian',  icon: '📖', cls: 'sub-russian' }
  ];
  const SLOTS_COUNT = 7;

  let schedule = new Array(SLOTS_COUNT).fill(null);
  let slotTimes = [];
  let draggedId = null;
  let draggedFromSlot = null;

  const subjectsList = document.getElementById('subjectsList');
  const slotsList = document.getElementById('slotsList');
  const messageEl = document.getElementById('message');

  function roundTo5(n) {
    return Math.round(n / 5) * 5;
  }

  function generateTimes() {
    const times = [];
    const startOffset = Math.floor(Math.random() * 18) * 5;
    let currentMinutes = 7 * 60 + startOffset;

    for (let i = 0; i < SLOTS_COUNT; i++) {
      times.push(currentMinutes);
      const interval = roundTo5(50 + Math.random() * 30);
      currentMinutes += interval;
    }

    return times.map(minutes => formatTime(minutes));
  }

  function formatTime(totalMinutes) {
    let hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;
    const period = hours >= 12 ? 'pm' : 'am';

    if (hours > 12) hours -= 12;
    if (hours === 0) hours = 12;

    return `${hours}.${minutes.toString().padStart(2, '0')} ${period}`;
  }

  function renderSubjects() {
    subjectsList.innerHTML = '';
    const placed = new Set(schedule.filter(s => s !== null));
    SUBJECTS.forEach(sub => {
      const el = document.createElement('div');
      el.className = 'subject ' + sub.cls;
      el.draggable = !placed.has(sub.id);
      el.dataset.id = sub.id;
      if (placed.has(sub.id)) {
        el.style.opacity = '0.4';
        el.style.cursor = 'default';
        el.title = 'Already in schedule';
      }
      el.innerHTML = `<span class="icon">${sub.icon}</span><span>${sub.name}</span>`;
      el.addEventListener('dragstart', e => {
        if (!el.draggable) return;
        draggedId = sub.id;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      el.addEventListener('dragend', () => {
        el.classList.remove('dragging');
        draggedId = null;
      });
      subjectsList.appendChild(el);
    });
  }

  function renderSlots() {
    slotsList.innerHTML = '';
    for (let i = 0; i < SLOTS_COUNT; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot ' + (schedule[i] ? 'filled' : 'empty');
      slot.dataset.index = i;

      const timeEl = document.createElement('div');
      timeEl.className = 'slot-time';
      timeEl.textContent = slotTimes[i];
      slot.appendChild(timeEl);

      const num = document.createElement('div');
      num.className = 'slot-num';
      num.textContent = i + 1;
      slot.appendChild(num);

      if (schedule[i]) {
        const sub = SUBJECTS.find(s => s.id === schedule[i]);
        const subEl = document.createElement('div');
        subEl.className = 'subject ' + sub.cls;
        subEl.draggable = true;
        subEl.dataset.id = sub.id;
        subEl.dataset.fromSlot = i;
        subEl.innerHTML = `<span class="icon">${sub.icon}</span><span>${sub.name}</span>`;

        subEl.addEventListener('dragstart', e => {
          draggedId = sub.id;
          draggedFromSlot = i;
          subEl.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        subEl.addEventListener('dragend', () => {
          subEl.classList.remove('dragging');
          draggedId = null;
          draggedFromSlot = null;
        });

        slot.appendChild(subEl);

        const btn = document.createElement('button');
        btn.className = 'remove-btn';
        btn.textContent = '×';
        btn.title = 'Remove from schedule';
        btn.onclick = () => {
          schedule[i] = null;
          render();
          setMessage('info', 'Subject removed. You can place it again.');
        };
        slot.appendChild(btn);
      } else {
        const content = document.createElement('div');
        content.className = 'slot-content';
        content.textContent = '— free —';
        slot.appendChild(content);
      }

      slot.addEventListener('dragover', e => { 
        e.preventDefault(); 
        slot.classList.add('over'); 
      });
      slot.addEventListener('dragleave', () => slot.classList.remove('over'));
      slot.addEventListener('drop', e => {
        e.preventDefault();
        slot.classList.remove('over');
        if (!draggedId) return;
        const targetIdx = i;

        if (draggedFromSlot === targetIdx) return;

        const existing = schedule[targetIdx];

        if (draggedFromSlot != null) {
          schedule[draggedFromSlot] = existing;
        }
        schedule[targetIdx] = draggedId;

        draggedId = null;
        draggedFromSlot = null;
        render();
        setMessage('info', 'Great! Keep filling the schedule.');
      });

      slotsList.appendChild(slot);
    }
  }

  function render() {
    renderSubjects();
    renderSlots();
  }

  function setMessage(type, text) {
    messageEl.className = 'message ' + type;
    messageEl.textContent = text;
  }

  function checkSchedule() {
    const placed = schedule.filter(s => s !== null);
    const unique = new Set(placed);
    if (placed.length === 5 && unique.size === 5) {
      const emptyCount = schedule.filter(s => s === null).length;
      setMessage('success', `🎉 Done! Schedule is complete. Free slots: ${emptyCount}`);
    } else if (placed.length < 5) {
      setMessage('error', `Add ${5 - placed.length} more subject(s). Currently: ${placed.length}/5`);
    } else {
      setMessage('error', 'Each subject must appear in the schedule exactly once.');
    }
  }

  function resetGame() {
    schedule = new Array(SLOTS_COUNT).fill(null);
    slotTimes = generateTimes();
    render();
    setMessage('info', 'Schedule cleared. Start over!');
  }

  // Initialization
  slotTimes = generateTimes();
  render();
</script>

</body>
</html>
